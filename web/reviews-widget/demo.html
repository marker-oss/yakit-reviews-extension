<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Отзывы — демо</title>
    <link rel="stylesheet" href="./reviews-widget.css" />
  </head>
  <body class="rw-demo-page">
    <main class="demo-shell">
      <section class="product-strip" aria-label="Карточка товара">
        <div class="product-media">
          <img src="./assets/product-card.svg" alt="" />
        </div>
        <div class="product-copy">
          <p class="product-kicker">Отзывы покупателей</p>
          <h1>Платье для спокойного вечера</h1>
          <p>Реальные отзывы с Wildberries, Яндекс Маркета и Ozon в одном аккуратном блоке.</p>
        </div>
      </section>

      <section
        id="reviews-widget"
        class="reviews-widget"
        aria-label="Отзывы покупателей"
      ></section>
    </main>

    <script src="./reviews-widget.js"></script>
    <script>
      const [videoReviewOzon] = ReviewsWidget.sampleReviews.filter((r) => r.media.some((m) => m.kind === "video"));
      const videoReviewWb = { ...videoReviewOzon, marketplace: "wb", externalReviewId: "wb-1003", authorName: "Анна С.", media: [{ kind: "video", url: "./assets/demo-review-2.mp4", previewUrl: "./assets/review-video.svg" }] };
    </script>
    <script>
      ReviewsWidget.mount(document.querySelector("#reviews-widget"), {
        reviews: [...ReviewsWidget.sampleReviews, { ...videoReviewWb }],
        productName: "Платье (пример)",
        config: { layout: { mode: "video", pageSize: 8, video: { tileWidth: 260 } }, defaults: { minRating: 0 } },
        // Вариант «стена UGC»: config: { layout: { mode: "wall", pageSize: 8, wall: { minTileWidth: 200, maxTiles: 24 } }, appearance: { preset: "shoppable" }, defaults: { minRating: 0 } },
      });
    </script>
  </body>
</html>
