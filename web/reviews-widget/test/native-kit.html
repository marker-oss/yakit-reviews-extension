<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Native Kit preset smoke</title>
  <link rel="stylesheet" href="../reviews-widget.css" />
  <style>
    body {
      --ys-font-family: "Mulish", Arial, sans-serif;
      --ys-background-primary: #ffffff;
      --ys-background-neutral: #f3f4f6;
      --ys-color-token-text-primary: #0f2248;
      --ys-color-token-text-secondary: #62708d;
      --ys-color-token-border-primary: #dfe3eb;
      --ys-color-token-brand-primary: #1677ff;
      --ys-color-token-brand-primary-contrast: #ffffff;
      margin: 0;
      padding: 40px;
      background: #fff;
      color: var(--ys-color-token-text-primary);
      font-family: var(--ys-font-family);
    }
    main { max-width: 1280px; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <section id="reviews-widget" class="reviews-widget" aria-label="Отзывы покупателей"></section>
  </main>
  <script src="../reviews-widget.js"></script>
  <script>
    const params = new URLSearchParams(location.search)
    const preset = params.get('preset') || 'native-kit'
    const presets = {
      'native-kit': {
        appearance: { preset: 'native-kit' },
        typography: { inheritSite: true, radius: 16, density: 'compact' },
        layout: { mode: 'carousel', columns: 3, pageSize: 3 },
        theme: { accent: '#1677ff', text: '#0f2248', muted: '#62708d', panel: '#ffffff', border: '#dfe3eb', star: '#ffb800' }
      },
      minimal: {
        appearance: { preset: 'minimal' },
        typography: { inheritSite: false, radius: 8, density: 'compact' },
        layout: { mode: 'grid', columns: 2, pageSize: 4 },
        theme: { accent: '#111827', text: '#111827', muted: '#6b7280', panel: '#ffffff', border: '#e5e7eb', star: '#f5b301' }
      },
      editorial: {
        appearance: { preset: 'editorial' },
        typography: { inheritSite: false, radius: 18, density: 'comfortable' },
        layout: { mode: 'list', columns: 1, pageSize: 3 },
        theme: { accent: '#3f3f46', text: '#18181b', muted: '#71717a', panel: '#ffffff', border: '#e4e4e7', star: '#b45309' },
        visibility: { ratingDistribution: false, filters: false }
      },
      'compact-commerce': {
        appearance: { preset: 'compact-commerce' },
        typography: { inheritSite: false, radius: 10, density: 'compact' },
        layout: { mode: 'grid', columns: 3, pageSize: 6 },
        theme: { accent: '#1d4ed8', text: '#111827', muted: '#4b5563', panel: '#ffffff', border: '#d1d5db', star: '#d97706' },
        visibility: { ratingDistribution: false, filters: false }
      },
      'lead-summary': {
        appearance: { preset: 'lead-summary' },
        typography: { inheritSite: false, radius: 14, density: 'compact' },
        layout: { mode: 'carousel', columns: 3, pageSize: 4 },
        theme: { accent: '#7c3aed', text: '#111827', muted: '#6b7280', panel: '#ffffff', border: '#e5e7eb', star: '#f59e0b' },
        visibility: { photos: true, ratingDistribution: true, filters: false }
      }
    }
    const config = presets[preset] || presets['native-kit']
    ReviewsWidget.mount(document.querySelector('#reviews-widget'), {
      reviews: ReviewsWidget.sampleReviews,
      productName: 'Рейтинг товара',
      sellerArticle: 'demo-article',
      submissionUrl: '/api/review-submissions',
      submissionConfigUrl: '/api/review-submission-config',
      submissionConfig: { enabled: true, privacyUrl: '/privacy' },
      config
    })
  </script>
</body>
</html>
