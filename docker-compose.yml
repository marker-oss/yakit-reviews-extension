services:
  reviews:
    build: .
    image: reviews:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Keep the SQLite file on the named volume regardless of .env.
      REVIEWS_DB_DSN: /data/reviews.db
      REVIEWS_SITE_PRODUCT_LINKS: /data/product-links.json
    volumes:
      - reviews-data:/data
      # Published reviews-data export: must outlive container recreation
      # (auto-updates), otherwise the widget loses its data until the next
      # manual «Опубликовать».
      - reviews-exports:/app/web/reviews-widget/reviews-data

volumes:
  reviews-data:
  reviews-exports:
